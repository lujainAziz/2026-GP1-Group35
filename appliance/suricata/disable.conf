# ASSAS Sprint 2 — approved rule-scope tuning (Group A, 2026-11-05, and Round 2, 2026-11-09).
# Deployed to /etc/suricata/disable.conf; suricata-update applies it on every
# run, so these exceptions persist across rule updates.
#
# Scope: the 12 normal-usage informational SIDs approved on 2026-11-05, plus
# Round 2 (2026-11-09, team decision): every rule that only produces trivial
# alerts (normal usage or harmless protocol oddities).
# Capture-load check completed 2026-11-09 (docs/sprint-2/evidence/
# capture-load-check.md): a phone on Assas-Test played 1080p video for ~11 min,
# ~248,000 packets processed, capture.kernel_drops = 0 and
# tcp.reassembly_gap = 0 (stats.log omits zero counters; null-values is not
# enabled). Conclusion: STREAM events are not caused by capture loss.
# Previously kept by decision, reversed by the team on 2026-11-09 and now
# disabled in Round 2: FILE_SHARING (2049201), abused-hosting (2063117,
# 2063118), non-standard STUN (2033078), the SURICATA STREAM group and the
# decoder SIDs below. packed-exe and ZeroSSL rules are NOT disabled and stay
# enabled. 2100498 (GPL ATTACK_RESPONSE id check returned root) stays enabled
# as the detection self-test. Severity mapping unchanged; existing alerts are
# never deleted.

