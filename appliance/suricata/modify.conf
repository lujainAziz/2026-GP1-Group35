# ASSAS rule modifications (Round 5, 2026-11-23). Deployed to
# /etc/suricata/modify.conf; suricata-update applies it on every run, so the
# change persists across rule updates.
#
# Format: modify <sid> "<from>" "<to>" (regular expression and replacement,
# applied to the rule text).

# 2016503 (ET INFO JAVA - Java Serialized Data Download) sets flowbit
# et.exploitkitlanding, which is checked by 2014526 (ET EXPLOIT_KIT Exploit Kit
# Delivering JAR Archive to Client). Disabling 2016503 would remove one of about
# 190 rules that set this flowbit, so it stays enabled as a silent helper to
# keep full detection for 2014526: flowbits:noalert keeps
# it setting the flowbit without raising an alert. ET Open rules write the SID
# as "sid:<n>;" (no space), so the pattern matches exactly once per rule.
modify 2016503 "sid:2016503;" "flowbits:noalert; sid:2016503;"
