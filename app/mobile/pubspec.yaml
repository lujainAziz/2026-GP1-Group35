name: assas_mobile
description: Assas mobile app (Android / iOS).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Shared theme, models and data layer (same repo, not downloaded)
  assas_core:
    path: ../packages/assas_core

  # Phone-only packages (NOT used by the 7-inch display)
  mobile_scanner: ^7.0.0        # QR scanning with the camera
  shared_preferences: ^2.3.0    # stores the pairing token
  nsd: ^4.1.0                   # DNS-SD browse for _assas._tcp (android/ios/macos/windows)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
